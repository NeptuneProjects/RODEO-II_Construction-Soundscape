# South Fork Wind, Summer 2023 (RODEO II)
#
# Data source directories are relative to the South Fork raw data directory,
# given at run time:
#   soundscape inventory --site config/sites/southfork.toml --data-dir <path>
# It holds the cruise legs; the SHRU recordings are under Leg4_2023_AUG_12/.

name = "South Fork"
output_dir = "results/southfork"
events = "config/sites/southfork/events.csv"
piles = "config/sites/southfork/piles.csv"

# The neighbor check is off: the South Fork soft start is single strikes about
# 12 s apart, which a check for strikes within a few seconds would reject.
# Without it, 99.6% of the 2025 detections are found.
[detector]
band = [100.0, 300.0]
threshold = 0.05
min_interval_s = 1.0
smooth_s = 0.02
normalization_window_s = 60.0
min_snr_db = 10.0
min_neighbors = 0

[extract]
pre_s = 0.6
post_s = 0.6
filter = { type = "highpass", freq = 10.0 }

[ambient]
offset_s = 660.0
duration_s = 600.0
interval_s = 60.0
psd_segment_s = 5.0
psd_overlap = 0.9
filter = { type = "highpass", freq = 10.0 }

[pulse_psd]
nperseg = 16384
overlap = 0.95

[report]
style = "config/jasa_fig_style.mplstyle"
author = "William F. Jenkins, Ph.D."
affiliation = "Scripps Institution of Oceanography, University of California San Diego"
met = "data/met/met_2023.csv" # BUZM3 wind and 44097 waves, 2023 (scripts/data/met_data.py)

# Stations supplying `met` (positions from the NDBC station pages).
[[report.met_stations]]
name = "BUZM3"
description = "NDBC C-MAN station, Buzzards Bay, MA; anemometer 24.8 m above mean sea level"
latitude = 41.397
longitude = -71.033
variables = ["WSPD"]
source = "https://www.ndbc.noaa.gov/station_page.php?station=buzm3"

[[report.met_stations]]
name = "44097"
description = "Block Island, RI (CDIP 154) Waverider buoy, Scripps Institution of Oceanography; 49.4 m water depth"
latitude = 40.966
longitude = -71.123
variables = ["WVHT"]
source = "https://www.ndbc.noaa.gov/station_page.php?station=44097"

# ---------------------------------------------------------------------------
# Sensors. Channels are hydrophone channels on each SHRU; strikes are detected
# on `detect_channel` and every channel is windowed at the detected times.
# ---------------------------------------------------------------------------

[[sensors]]
name = "Tetra"
description = "SHRU 921 recorder with a tetrahedral hydrophone array on the geosled"
latitude = 41.08493
longitude = -71.09504
water_depth_m = 33.7
channels = [0, 1, 2, 3]
detect_channel = 0

[sensors.source]
type = "glob"
directory = "Leg4_2023_AUG_12/SHRU_921"
pattern = "SHRU_921*/[!._]*.D23"
file_format = "SHRU"
clock = { time_check_0 = 2023-06-23T18:00:00, time_check_1 = 2023-08-12T14:00:00, offset_0 = 120e-9, offset_1 = -5.920e-3 }

[sensors.calibration]
type = "flat"
sensitivity = [-203.8, -203.8, -203.5, -203.9]
fixed_gain = [6.0, 6.0, 6.0, 6.0]

# Hydrophone depths ("Mooring Depth [m]") and serial numbers from
# config/legacy/experiment/geosled.csv.
[[sensors.hydrophones]]
channel = 0
depth_m = 33.7
serial_number = "722010"
description = "Tetrahedral CH-0"

[[sensors.hydrophones]]
