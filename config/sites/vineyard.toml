# Vineyard Wind, November-December 2023 (RODEO II)

# Data source directories are relative to the Vineyard Wind raw data
# directory, given at run time:
#   soundscape inventory --site config/sites/vineyard.toml --data-dir <path>
# It holds one directory per recorder, VLA1_shru905/ and VLA2_shru920/, each
# with the recordings under Data/.

name = "Vineyard Wind"
output_dir = "results/vineyard"
events = "config/sites/vineyard/events.csv"
piles = "config/sites/vineyard/piles.csv"

# The original Vineyard Wind analysis normalized unsmoothed energy by the
# maximum within hand-picked time ranges, with per-sensor thresholds. These
# generic settings find all 2,928 of its strikes on every sensor, plus the
# soft start before its first range, without hand-picked ranges. The neighbor
# check rejects mooring noise on VLA2.
[detector]
band = [100.0, 300.0]
threshold = 0.05
min_interval_s = 1.0
smooth_s = 0.02
normalization_window_s = 60.0
min_snr_db = 10.0
min_neighbors = 2
neighbor_window_s = 4.0

[extract]
pre_s = 0.6
post_s = 0.6
filter = { type = "highpass", freq = 10.0 }

[background]
offset_s = 660.0
duration_s = 600.0
interval_s = 60.0
psd_segment_s = 5.0
psd_overlap = 0.9
filter = { type = "highpass", freq = 10.0 }

[pulse_psd]
nperseg = 16384
overlap = 0.95

# Correlation between every pair of pulses on each hydrophone, 10-200 Hz: the
# bubble curtains attenuated much of the pile-driving energy above 200 Hz.
# Summaries describe the correlation out to 300 s between strikes; `threads`
# is the number of Julia threads for the full matrices (castilon has 384 cores).
[correlation]
band = [10.0, 200.0]
max_dt_s = 300.0
threads = 128

[report]
style = "config/jasa_fig_style.mplstyle"
author = "William F. Jenkins, Ph.D."
affiliation = "Scripps Institution of Oceanography, University of California San Diego"
met = "data/met/met_2023.csv" # BUZM3 wind and 44097 waves, 2023 (scripts/data/met_data.py)

# Stations supplying `met` (positions from the NDBC station pages).
[[report.met_stations]]
name = "BUZM3"
description = "NDBC C-MAN station, Buzzards Bay, MA; anemometer 24.8 m above mean sea level"
latitude = 41.397
longitude = -71.033
variables = ["WSPD"]
source = "https://www.ndbc.noaa.gov/station_page.php?station=buzm3"

[[report.met_stations]]
name = "44097"
description = "Block Island, RI (CDIP 154) Waverider buoy, Scripps Institution of Oceanography; 49.4 m water depth"
latitude = 40.966
longitude = -71.123
variables = ["WVHT"]
source = "https://www.ndbc.noaa.gov/station_page.php?station=44097"

[[sensors]]
name = "VLA1"
description = "SHRU 905 recorder on vertical line array 1"
latitude = 41.07135
longitude = -70.34438
water_depth_m = 38.5
channels = [0, 1, 2, 3]
detect_channel = 3

[sensors.source]
type = "glob"
directory = "VLA1_shru905/Data"
pattern = "[!._]*.D23"
file_format = "SHRU"

[sensors.calibration]
type = "flat"
sensitivity = [-203.9, -204.0, -203.9, -204.1]
fixed_gain = [6.0, 6.0, 6.0, 6.0]

# Serial numbers from vineyard_wind/data/sensors.csv. Hydrophones are
# identified by serial number; "VLA1"/"VLA2" are per-site mooring labels.
# Depths follow the serial numbers as recorded at South Fork
# (config/legacy/experiment/vla2.csv); vineyard_wind/data/sensors.csv had
# attached them to the mooring labels instead.
[[sensors.hydrophones]]
channel = 0
depth_m = 16.3
serial_number = "722017"
description = "CH-0 hydrophone"

[[sensors.hydrophones]]
channel = 1
depth_m = 17.8
serial_number = "722019"
description = "CH-1 hydrophone"

[[sensors.hydrophones]]
channel = 2
depth_m = 21.4
serial_number = "722020"
description = "CH-2 hydrophone"

[[sensors.hydrophones]]
channel = 3
depth_m = 22.9
serial_number = "722022"
description = "CH-3 hydrophone"

[[sensors]]
name = "VLA2"
description = "SHRU 920 recorder on vertical line array 2"
latitude = 41.07133
longitude = -70.28457
water_depth_m = 32.5
channels = [0, 1, 2, 3]
detect_channel = 0

[sensors.source]
type = "glob"
directory = "VLA2_shru920/Data"
pattern = "[!._]*.D23"
file_format = "SHRU"

[sensors.calibration]
type = "flat"
sensitivity = [-204.0, -204.1, -204.0, -204.2]
fixed_gain = [6.0, 6.0, 6.0, 6.0]

# Serial numbers from vineyard_wind/data/sensors.csv. Depths follow the
# serial numbers as recorded at South Fork (config/legacy/experiment/vla1.csv).
[[sensors.hydrophones]]
channel = 0
depth_m = 16.2
serial_number = "722013"
description = "CH-0 hydrophone"

[[sensors.hydrophones]]
channel = 1
depth_m = 17.7
serial_number = "722014"
description = "CH-1 hydrophone"

[[sensors.hydrophones]]
channel = 2
depth_m = 21.3
serial_number = "722015"
description = "CH-2 hydrophone"

[[sensors.hydrophones]]
