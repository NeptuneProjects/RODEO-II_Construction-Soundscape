[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soundscape"
version = "0.2.2"
description = "Soundscape analysis of offshore pile driving, generalized across wind farm sites"
authors = [{ name = "William F. Jenkins", email = "wfjenkins@ucsd.edu" }]
requires-python = ">= 3.12"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "pillow>=12.3.0",
    "polars<2",           # TritonOA inventory loading breaks on polars 2
    "pydantic>=2",
    "pyproj",
    "python-docx>=1.2.0",
    "rodeo",
    "scipy",
    "TritonOA",
]

[project.optional-dependencies]
# Analyses in scripts/ outside the soundscape workflow: propagation modeling,
# CTD and meteorological figures, and the study area map. Only what rodeo
# (bathyreq, cmasher, cmocean, juliacall, tqdm) does not already provide.
full = [
    "jupyterlab", # the notebooks in scripts/
    "netcdf4",    # scripts/plotting/plot_pile_sim.py
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
soundscape = "soundscape.workflow:main"

[tool.uv.sources]
rodeo = { git = "https://github.com/NeptuneProjects/RODEO-II.git" }
TritonOA = { git = "https://github.com/TritonOA/TritonOA.git" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/soundscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
